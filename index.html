<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمرو غنيم — مطوّر ويب متكامل</title>
<meta name="description" content="الموقع الشخصي لعمرو غنيم — مطوّر ويب متكامل (Full-Stack) وطالب علوم حاسب بجامعة المنصورة. معرض الأعمال، المهارات، وطرق التواصل.">
<meta name="theme-color" content="#F3EFE7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F3EFE7'/><rect x='8' y='8' width='16' height='16' fill='%23C14A22'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================
    ١) الأساسيات والمتغيرات
========================================================== */
:root{
  --paper:#F3EFE7;
  --paper-2:#E9E2D4;
  --ink:#1B1915;
  --text-2:#57503F;
  --muted:#807768;
  --line:rgba(27,25,21,.16);
  --accent:#C14A22;
  --accent-2:#D96B41;
  --dark:#171410;
  --dark-text:#EAE4D6;
  --dark-line:rgba(234,228,214,.16);
  --f-display:'Almarai','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-mono:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--f-body);background:var(--paper);color:var(--ink);
  line-height:1.9;font-size:16px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::selection{background:var(--accent);color:var(--paper)}
img{display:block}
a{color:inherit}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:#C7BFAE;border:2px solid var(--paper)}
body.lock{overflow:hidden}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:clamp(20px,4vw,64px)}
section.block{padding-block:clamp(4.5rem,9vw,8rem);scroll-margin-top:92px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sq{display:inline-block;width:8px;height:8px;background:var(--accent);flex:none}
.svg-sprite{display:none}
body.has-cursor, body.has-cursor *{cursor:none}
body.lb-open .lightbox, body.lb-open .lightbox *{cursor:default}
body.lb-open .lightbox .lb-stage.zoomed .lb-img{cursor:grab}
body.lb-open .lightbox .lb-stage.zoomed .lb-img:active{cursor:grabbing}

/* حبيبات فيلم خفيفة تعطي الموقع ملمسًا ورقيًا */
.grain{
  position:fixed;inset:-50%;width:200%;height:200%;z-index:3500;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.6'/></svg>");
  animation:grain .9s steps(2) infinite;
}
@keyframes grain{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-3%)}
  60%{transform:translate(-2%,-2%)} 80%{transform:translate(3%,3%)}
}
.nojs{background:var(--ink);color:var(--paper);text-align:center;padding:1rem;font-size:.9rem}

/* ==========================================================
    ٢) الهيدر والقائمة
========================================================== */
.site-head{position:fixed;top:0;right:0;left:0;z-index:1000;border-bottom:1px solid transparent;transition:background .35s,border-color .35s,backdrop-filter .35s}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;transition:height .3s}
.site-head.scrolled{background:rgba(243,239,231,.87);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--line)}
.site-head.scrolled .wrap{height:64px}
body.menu-open .site-head{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.08rem;text-decoration:none;display:flex;align-items:center;gap:.45rem}
.logo .sq{width:9px;height:9px}
.site-nav{display:flex;gap:clamp(1.1rem,2.4vw,2.1rem)}
.site-nav a{position:relative;text-decoration:none;font-weight:500;font-size:.95rem;padding-block:.3rem}
.site-nav a::after{content:'';position:absolute;bottom:0;right:0;width:0;height:2px;background:var(--accent);transition:width .35s var(--ease)}
.site-nav a:hover::after,.site-nav a.active::after{width:100%}
.site-nav a.active{color:var(--accent)}
.head-cta{margin-inline-start:1rem}
.burger{display:none;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:44px;height:44px;background:none;border:none;padding:0}
.burger span{display:block;width:26px;height:2px;background:var(--ink);transition:transform .35s var(--ease)}
body.menu-open .burger span:first-child{transform:translateY(4.5px) rotate(45deg)}
body.menu-open .burger span:last-child{transform:translateY(-4.5px) rotate(-45deg)}
.mnav{
  position:fixed;inset:0;z-index:900;background:var(--paper);
  display:flex;flex-direction:column;justify-content:center;
  padding:6rem clamp(1.4rem,6vw,3rem) 3rem;
  visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s linear .35s;
}
body.menu-open .mnav{visibility:visible;opacity:1;transition:opacity .35s ease}
.mnav a{
  display:flex;align-items:baseline;gap:1.1rem;text-decoration:none;
  font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,8.5vw,3rem);
  padding-block:1rem;border-bottom:1px solid var(--line);
  transform:translateY(26px);opacity:0;transition:transform .5s var(--ease),opacity .5s;
}
body.menu-open .mnav a{transform:none;opacity:1}
body.menu-open .mnav a:nth-child(1){transition-delay:.06s}
body.menu-open .mnav a:nth-child(2){transition-delay:.12s}
body.menu-open .mnav a:nth-child(3){transition-delay:.18s}
body.menu-open .mnav a:nth-child(4){transition-delay:.24s}
body.menu-open .mnav a:nth-child(5){transition-delay:.3s}
.mnav .mi{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--accent)}
.mnav-foot{margin-top:2.4rem;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);direction:ltr;text-align:right}

/* ==========================================================
    ٣) الأزرار
========================================================== */
.btn{
  display:inline-flex;align-items:center;gap:.7rem;padding:.9rem 1.7rem;
  font-family:var(--f-display);font-weight:700;font-size:.95rem;text-decoration:none;
  border:1px solid var(--ink);background:transparent;color:var(--ink);transition:.3s;
}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn--solid{background:var(--ink);color:var(--paper)}
.btn--solid:hover{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn--mini{padding:.55rem 1.15rem;font-size:.86rem}
.btn--mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.01em}
.btn .ic{width:17px;height:17px}

/* ==========================================================
    ٤) قسم البطل (Hero)
========================================================== */
.hero{position:relative}
.hero-wrap{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:112px;padding-bottom:52px;position:relative}
.hero-meta{
  display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  padding-block:1.1rem;border-bottom:1px solid var(--line);margin-bottom:clamp(2.6rem,6vh,4.5rem);
}
.hm-ar{display:flex;align-items:center;gap:.6rem;font-weight:500;font-size:.95rem}
.hm-en{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;color:var(--muted)}
.hero-name{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,14vw,11rem);line-height:1.22;color:var(--ink)}
.hero-name .line{display:block;overflow:hidden;padding-block:.04em .1em}
.hero-name .lw{display:inline-block;transform:translateY(115%);animation:rise 1s cubic-bezier(.16,1,.3,1) forwards}
.hero-name .line-2 .lw{animation-delay:.14s}
.hero-name .line-2{margin-inline-start:clamp(1.5rem,7vw,6rem)}
.sq-name{display:inline-block;width:.13em;height:.13em;background:var(--accent);margin-inline-start:.16em}
@keyframes rise{to{transform:translateY(0)}}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;margin-top:clamp(2rem,5vh,3.5rem);flex-wrap:wrap}
.hero-desc{max-width:42ch;font-size:1.05rem;color:var(--text-2);font-weight:300}
.hero-desc strong{font-weight:600;color:var(--ink)}
.hero-side{display:flex;flex-direction:column;gap:.55rem;font-size:.9rem;color:var(--text-2)}
.status{display:flex;align-items:center;gap:.55rem;font-weight:500;color:var(--ink)}
.pulse{width:9px;height:9px;background:var(--accent);border-radius:50%;position:relative;flex:none}
.pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(2.5);opacity:0}}
.hero-cta{display:flex;gap:1rem;flex-wrap:wrap;margin-top:clamp(2.2rem,5vh,3.4rem)}
.hero-vert{
  position:absolute;inset-inline-end:clamp(6px,1.4vw,18px);top:50%;transform:translateY(-50%);
  writing-mode:vertical-rl;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.3em;color:var(--muted);
}
.fade-el{opacity:0;animation:fadeUp .8s var(--ease) forwards}
.d1{animation-delay:.5s}.d2{animation-delay:.62s}.d3{animation-delay:.72s}.d4{animation-delay:.82s}.d5{animation-delay:.94s}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media (max-height:640px){.hero-name{font-size:clamp(3.4rem,10vw,7rem)}}

/* شريط المهارات المتحرك */
.marquee{border-block:1px solid var(--line);padding-block:1rem;overflow:hidden}
.mq-track{display:flex;align-items:center;width:max-content;animation:mq 60s linear infinite}
.marquee:hover .mq-track{animation-play-state:paused}
.mq-l{font-family:var(--f-mono);font-weight:500;font-size:.82rem;letter-spacing:.14em;color:rgba(27,25,21,.72);white-space:nowrap}
.mq-a{font-family:var(--f-display);font-weight:700;font-size:.95rem;color:rgba(27,25,21,.8);white-space:nowrap}
.mq-track .sq{width:5px;height:5px;margin-inline:1.7rem}
@keyframes mq{to{transform:translateX(50%)}}

/* ==========================================================
    ٥) رؤوس الأقسام
========================================================== */
.sec-head{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:1.6rem;margin-bottom:clamp(2.4rem,6vw,4.2rem)}
.sec-idx{font-family:var(--f-display);font-weight:800;color:var(--accent)}
.sec-title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1.4}
.sec-en{margin-inline-start:auto;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.18em;color:var(--muted)}

/* ==========================================================
    ٦) نبذة عني
========================================================== */
.about-grid{display:grid;grid-template-columns:7fr 5fr;gap:clamp(2rem,4vw,4rem)}
.about-main .lead{font-size:clamp(1.3rem,2.4vw,1.75rem);font-weight:300;line-height:2;color:var(--ink)}
.about-main .lead em{font-style:normal;font-weight:500;color:var(--accent)}
.about-main .body{margin-top:1.8rem;max-width:60ch;color:var(--text-2);font-weight:300;line-height:2.05}
.about-side{margin-top:2.6rem}
.facts > div{padding-block:1.05rem;border-bottom:1px solid var(--line)}
.facts > div:first-child{border-top:1px solid var(--line)}
.facts dt{font-size:.8rem;color:var(--muted);margin-bottom:.1rem}
.facts dd{font-size:.95rem;font-weight:500}
.facts dd a{text-decoration:underline;text-decoration-color:rgba(27,25,21,.3);text-underline-offset:4px;transition:color .25s}
.facts dd a:hover{color:var(--accent);text-decoration-color:var(--accent)}
.facts dd [dir="ltr"]{word-break:break-all}

/* ==========================================================
    ٧) التعليم
========================================================== */
.edu-grid{display:grid;grid-template-columns:7fr 5fr;gap:clamp(2rem,4vw,4rem)}
.edu-main h3{font-family:var(--f-display);font-weight:800;font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.55}
.edu-fac{margin-top:.5rem;color:var(--text-2)}
.edu-meta{list-style:none}
.edu-meta li{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-block:.8rem;border-bottom:1px solid var(--line)}
.edu-meta li:first-child{border-top:1px solid var(--line)}
.edu-meta span{color:var(--muted);font-size:.85rem}
.edu-meta strong{font-weight:600}
.edu-meta .mono{font-family:var(--f-mono);font-weight:500;font-size:.9rem}
.edu-note{margin-top:2.4rem;max-width:64ch;color:var(--text-2);font-weight:300;line-height:2.05}

/* ==========================================================
    ٨) المهارات
========================================================== */
.skills{border-bottom:1px solid var(--line)}
.skill-row{
  display:grid;grid-template-columns:minmax(140px,220px) 1fr auto;align-items:center;gap:1.5rem;
  padding-block:1.7rem;padding-inline:1rem;border-top:1px solid var(--line);
  transition:background .35s;
}
.s-cat{font-weight:600;font-size:.95rem;color:var(--muted);transition:color .3s}
.s-items{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1rem}
.s-items span{font-family:var(--f-display);font-weight:700;font-size:clamp(1.15rem,2.6vw,1.65rem);line-height:1.55;transition:color .3s}
.s-items .sq{width:6px;height:6px;transition:background .3s}
.s-en{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;color:var(--muted);transition:color .3s}
.skill-row:hover{background:var(--ink)}
.skill-row:hover .s-items span{color:var(--paper)}
.skill-row:hover .s-cat{color:rgba(243,239,231,.6)}
.skill-row:hover .s-en{color:var(--accent-2)}
.skill-row:hover .s-items .sq{background:var(--accent-2)}

/* ==========================================================
    ٩) معرض الأعمال
========================================================== */
.sec-hint{margin-top:-1.4rem;margin-bottom:3.2rem;display:flex;align-items:center;gap:.55rem;font-size:.9rem;color:var(--muted)}
.sec-hint .ic{width:15px;height:15px;color:var(--accent)}
.project + .project{margin-top:clamp(4rem,8vw,6.5rem)}
.p-head{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(1rem,3vw,2.5rem);align-items:start;margin-bottom:clamp(1.6rem,3vw,2.6rem)}
.p-idx{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4.5vw,3rem);line-height:1.1;color:var(--accent)}
.p-title{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,3.2vw,2.1rem);line-height:1.45}
.p-en{display:block;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;color:var(--muted);margin-top:.25rem}
.p-desc{max-width:58ch;color:var(--text-2);margin-top:.9rem;font-size:.98rem;font-weight:300}
.p-tags{margin-top:.75rem;font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.p-link{
  display:inline-flex;align-items:center;gap:.55rem;padding:.7rem 1.15rem;white-space:nowrap;
  border:1px solid rgba(27,25,21,.35);text-decoration:none;
  font-family:var(--f-display);font-weight:700;font-size:.86rem;transition:.3s;
}
.p-link:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.p-link .ic{width:15px;height:15px}
.p-media{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(1rem,2.5vw,2rem);align-items:start}
.shot{margin:0;cursor:pointer}
.shot-img{overflow:hidden;background:var(--paper-2)}
.shot-img img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.shot:hover .shot-img img{transform:scale(1.05)}
.shot figcaption{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-top:.75rem}
.shot .cap{font-size:.88rem;color:var(--text-2)}
.shot-hint{
  display:inline-flex;align-items:center;gap:.45rem;
  font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--accent);
  opacity:0;transform:translateX(8px);transition:.35s var(--ease);
}
.shot:hover .shot-hint{opacity:1;transform:none}
.shot-hint .ic{width:13px;height:13px}
@media (hover:none){.shot-hint{opacity:.85;transform:none}}
.shot--a{grid-column:1/span 7}
.shot--a .shot-img{aspect-ratio:16/9}
.shot--b{grid-column:8/span 5;margin-top:clamp(2rem,6vw,4.5rem)}
.shot--b .shot-img{aspect-ratio:3/2}
.shot-missing{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;
  border:1.5px dashed rgba(27,25,21,.35);background:var(--paper-2);
  text-align:center;padding:1.2rem;
}
.shot-missing .ic{width:24px;height:24px;color:var(--accent)}
.shot-missing span{font-family:var(--f-display);font-weight:700;font-size:.85rem;color:var(--text-2)}
.shot-missing code{font-family:var(--f-mono);font-size:.72rem;direction:ltr;word-break:break-all;color:var(--muted)}

/* ==========================================================
    ١٠) عارض الصور (Lightbox)
========================================================== */
.lightbox{
  --lb-t:64px;--lb-b:78px;
  position:fixed;inset:0;z-index:3000;background:rgba(16,14,11,.95);color:var(--dark-text);
  opacity:0;visibility:hidden;
  transition:opacity .45s ease,visibility 0s linear .45s;
}
.lightbox.open{opacity:1;visibility:visible;transition:opacity .45s ease}
.lb-top{
  position:absolute;top:0;right:0;left:0;height:var(--lb-t);z-index:6;
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding-inline:clamp(.7rem,2vw,1.5rem);
}
.lb-info{display:flex;align-items:baseline;gap:.9rem;min-width:0}
.lb-title{font-family:var(--f-display);font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-count{font-size:.85rem;color:rgba(234,228,214,.6);flex:none
